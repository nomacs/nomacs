name: Update Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        config:
          #- name: "neon"
          #  tag: "22.04"
          #  dockerfile: "Dockerfile.kde-neon.2204"
          - name: "neon"
            tag: "24.04"
            dockerfile: "Dockerfile.kde-neon.2404"
          #- name: "ubuntu"
          #  tag: "22.04"
          #  dockerfile: "Dockerfile.ubuntu.2204"
          - name: "ubuntu"
            tag: "24.04"
            dockerfile: "Dockerfile.ubuntu.2404"
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          echo "Building image variant: ${{ matrix.config.name }}:${{ matrix.config.tag }} for ${{ matrix.platform.arch }}"

          cp -v "scripts/docker/${{ matrix.config.dockerfile }}" Dockerfile

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ matrix.config.name }}"

          docker buildx build \
            --platform "linux/${{ matrix.platform.arch }}" \
            -t "${IMAGE_NAME}" \
            --output "type=image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            .

          DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
          echo "Saving container digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_ENV"
          echo "${DIGEST}" > "digest-${{ matrix.config.name }}-${{ matrix.platform.arch }}.txt"

      - name: Export digest
        uses: actions/upload-artifact@v7
        with:
          name: "<unused>"
          path: "docker/digest*.txt"
          archive: false
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        config:
          - name: "neon"
            tag: "24.04"
          - name: "ubuntu"
            tag: "24.04"

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: "digest-${{ matrix.config.name }}-*.txt"
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.config.name }}:${{ matrix.config.tag }}"

          docker buildx imagetools create -t "${IMAGE}" \
            $(cat digest-*.txt | sed "s|^|ghcr.io/${{ github.repository_owner }}/${{ matrix.config.name }}@|")

      - name: Summary
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.config.name }}:${{ matrix.config.tag }}"
          echo "pushed multi-arch image: ${IMAGE}"
          docker buildx imagetools inspect "${IMAGE}"
